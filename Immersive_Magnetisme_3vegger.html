 :root {
  --ink:#e6eef4; --muted:#a6bacb; --dim:#8ba4ba; --bg:#090f19;
  --panel:#111c2a; --panel-raised:#162534; --edge:#2b4155; --fine:#233547;
  --cyan:#8debef; --teal:#4bbec7; --warm:#ffb37e; --blue:#8aa9ff; --red:#f48683;
  --mono:"Cascadia Mono",Consolas,"Liberation Mono",monospace;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  font-size:clamp(12px,min(1.05vw,1.68vh),22px);
  color:var(--ink); background:var(--bg); color-scheme:dark;
  font-synthesis:none; -webkit-tap-highlight-color:transparent;
}
* { box-sizing:border-box }
body { margin:0; overflow:hidden; user-select:none; -webkit-user-select:none }
button,input { font:inherit }
button {
  color:inherit; border:1px solid var(--edge); background:#122031; border-radius:.44rem;
  cursor:pointer; min-height:2.75rem; touch-action:manipulation;
}
button:hover { border-color:#6a99ac; background:#1b3040 }
button:active { background:#253d4d; transform:translateY(1px) }
button:focus-visible,input:focus-visible { outline:2px solid var(--cyan); outline-offset:4px }
button:disabled { cursor:default; opacity:.48; transform:none }
[hidden] { display:none !important }
svg { display:block; flex:none }
i { font-style:normal }
p,h1,h2,h3 { margin:0 }
p { text-wrap:pretty }
.icon { width:1.15rem; height:1.15rem; stroke:currentColor; fill:none; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round }
.eyebrow {
  color:var(--cyan); font-family:var(--mono); font-size:.79rem; font-weight:600;
  letter-spacing:.11em; text-transform:uppercase;
}
.app-shell {
  height:100dvh; max-width:2800px; margin:auto; padding:0 3.25rem 1.65rem;
  display:flex; flex-direction:column; gap:1.15rem; overflow:hidden;
  background:radial-gradient(ellipse at 70% 4%,#15304466,transparent 51%),
             linear-gradient(145deg,#0d1926 0%,#0a121e 52%,#0d1724 100%);
}
.topline {
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  min-height:4.25rem; border-bottom:1px solid var(--fine);
}
.brand { display:flex; align-items:center; gap:.78rem; font-size:.92rem; font-weight:710; letter-spacing:.025em }
.brand .logo {
  display:grid; place-items:center; width:2.15rem; height:2.15rem; border:1px solid #416676;
  border-radius:.38rem; background:linear-gradient(145deg,#1a3a47,#11212d); color:var(--cyan);
}
.brand .logo .icon { width:1.28rem; height:1.28rem }
.top-controls { display:flex; align-items:center; gap:.75rem }
.sync { display:flex; gap:.32rem; align-items:center; color:var(--muted); font-family:var(--mono); font-size:.74rem; letter-spacing:.04em }
.sync-dots { display:flex; align-items:center; gap:.26rem; margin-right:.27rem }
.sync-dots b { width:.43rem; height:.43rem; border-radius:50%; background:#4a5f70 }
.sync-dots b.online { background:var(--cyan); box-shadow:0 0 .38rem #92edf54a }
.flat { display:inline-flex; justify-content:center; align-items:center; gap:.42rem; padding:.45rem .72rem; font-weight:640; font-size:.82rem; white-space:nowrap }
.flat[aria-pressed="true"],.part-pick[aria-pressed="true"] { border-color:#5596a5; color:#b6f9fa; background:#183a46; box-shadow:inset 0 -2px #74c5ce55 }
.topic {
  display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:.65rem 1rem;
  flex:none; padding:.02rem 0 .17rem;
}
.topic h1 { font-size:3.1rem; font-weight:730; line-height:1.05; letter-spacing:-.057em; margin:.28rem 0 .39rem; }
.topic p { color:var(--muted); font-size:1.12rem; line-height:1.35 }
.topic .page-index { color:var(--dim); white-space:nowrap; align-self:center; font-family:var(--mono); font-size:.93rem; }
.page-index b { color:var(--cyan); font-weight:650 }
.slide-body { min-height:0; flex:1; }
.slide-body.enter { animation:appear .34s ease-out both }
@keyframes appear { from { opacity:.62; transform:translateY(5px) } to { opacity:1; transform:translateY(0) } }
.panel {
  position:relative; min-width:0; background:linear-gradient(145deg,#162333,#101b2a 84%);
  border:1px solid var(--edge); border-radius:.65rem;
}
.panel::before {
  content:""; position:absolute; z-index:0; left:.85rem; top:-1px; width:1.65rem; height:1px;
  pointer-events:none; background:#6dabb7;
}
.model-layout { height:100%; display:grid; grid-template-rows:minmax(0,1fr) auto auto; gap:.65rem }
.model-stage {
  overflow:hidden; isolation:isolate;
  background:
    radial-gradient(ellipse at 51% 50%,#2c475a99,transparent 69%),
    radial-gradient(ellipse at 50% 89%,#06111d,transparent 51%),
    linear-gradient(152deg,#142636,#0a1521 70%);
}
.model-stage::after {
  position:absolute; inset:0; z-index:-1; content:""; pointer-events:none;
  background:linear-gradient(#93c9ed0c 1px,transparent 1px),linear-gradient(90deg,#93c9ed0c 1px,transparent 1px);
  background-size:2rem 2rem; mask-image:radial-gradient(ellipse at 50% 58%,black,transparent 85%);
}
.model-stage canvas,.stage-annotations { position:absolute; inset:0; width:100%; height:100%; display:block; }
.model-stage canvas { touch-action:none; cursor:grab }
.model-stage canvas:active { cursor:grabbing }
.stage-annotations { pointer-events:none }
.stage-label {
  position:absolute; display:flex; align-items:center; gap:.48rem; left:1.14rem; top:1rem; pointer-events:none;
  color:#d2e4ed; font-size:.76rem; font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase;
}
.stage-label::before { content:""; display:block; width:.45rem; height:.45rem; border:1px solid var(--cyan); transform:rotate(45deg) }
.stage-hint { position:absolute; pointer-events:none; left:1.14rem; bottom:.85rem; color:#adbfce; font-size:.76rem }
.stage-note { left:auto; right:1.14rem; text-align:right }
.render-note {
  position:absolute; top:1rem; right:1rem; color:var(--warm); font-family:var(--mono);
  font-size:.76rem; background:#142333; padding:.35rem .5rem; border-radius:.3rem;
}
.model-tools { display:flex; align-items:center; justify-content:space-between; gap:.55rem; min-width:0; }
.tools-pack { display:flex; gap:.42rem; align-items:center; flex-wrap:wrap; }
.zoom-controls .flat { min-width:2.75rem; }
.parts { padding:.74rem 1rem .83rem; display:grid; gap:.55rem }
.part-tabs { display:flex; flex-wrap:wrap; gap:.36rem }
.part-pick {
  display:inline-flex; align-items:center; gap:.34rem; padding:.33rem .65rem;
  min-height:2.3rem; background:#111e2c; border-color:#2b4051; font-size:.76rem; font-weight:620;
}
.swatch { display:inline-block; width:.45rem; height:.45rem; border-radius:50%; background:var(--swatch); flex:none }
.part-info { min-height:2.85rem; display:flex; align-items:center; gap:.8rem }
.part-info strong { color:#ddedf3; font-size:1.02rem; font-weight:690; min-width:8rem; }
.part-info p { color:#b4c6d4; font-size:.9rem; line-height:1.35 }
.theory-layout { height:100%; display:grid; grid-template-rows:minmax(0,1fr) auto auto; gap:.83rem }
.theory-pages { display:grid; min-height:0; grid-template-columns:minmax(0,1.17fr) minmax(0,1fr); gap:1rem; }
.theory-pages.intro { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr); gap:.9rem }
.intro-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.83rem; min-height:0; }
.intro-cell { display:flex; padding:1.08rem 1.23rem; flex-direction:column; justify-content:center; gap:.5rem }
.intro-cell .symbol {
  font-family:var(--mono); display:flex; align-items:baseline; gap:.45rem; color:var(--cyan);
  font-size:2.1rem; font-weight:570; line-height:1.05;
}
.intro-cell .symbol small { font-size:.77rem; color:var(--muted); }
.intro-cell h2,.steps h2 { font-size:1.15rem; font-weight:670; }
.intro-cell p,.steps p,.formula p { color:#b9cad8; font-size:.98rem; line-height:1.43 }
.principle .icon { width:1.85rem; height:1.85rem; color:var(--cyan) }
.principle .energy { font-family:var(--mono); color:var(--warm); font-size:.78rem; line-height:1.28 }
.steps { padding:1.04rem 1.3rem; min-height:0; display:grid; }
.step {
  display:grid; align-content:center; gap:.36rem; position:relative; padding:.55rem .2rem .55rem 1.3rem;
  border-bottom:1px solid #284052;
}
.step:last-child { border-bottom:0 }
.step::before {
  content:""; position:absolute; left:.06rem; top:50%; width:.43rem; height:.43rem; border-radius:50%;
  border:1px solid #81c5d3; background:#1c3948; transform:translateY(-50%);
}
.steps h2 { letter-spacing:-.015em }
.formulas { display:grid; grid-auto-rows:1fr; gap:.65rem; min-height:0; }
.formula { display:grid; align-content:center; gap:.32rem; padding:.68rem 1.2rem }
.formula .eyebrow { font-size:.74rem }
.formula strong {
  font-family:var(--mono); color:#defcff; font-weight:600; font-size:1.63rem;
  line-height:1.2; white-space:nowrap; letter-spacing:-.065em;
}
.formula sub,.metric sub { font-size:.57em; vertical-align:baseline; position:relative; bottom:-.18em; letter-spacing:0 }
.concept-band {
  display:flex; gap:.75rem; align-items:center; padding:.66rem .96rem;
  min-height:3.15rem; background:#11222d; border:1px solid #315264; border-radius:.46rem;
  font-size:.86rem; line-height:1.35; color:#c6d9e1;
}
.concept-band .icon,.concept-band strong { color:#a5e9ee; flex:none }
.nav-deck {
  flex:none; display:grid; grid-template-columns:minmax(8rem,1fr) auto auto auto; align-items:center; gap:1.05rem;
  min-height:5.35rem; padding:.59rem .8rem .59rem 1.05rem; border-radius:.58rem;
  border:1px solid #334d63; background:linear-gradient(179deg,#1d3041,#122033);
  box-shadow:inset 0 1px #8fb1c52e,0 .24rem .7rem #060c1670;
}
.nav-state { display:grid; align-content:center; gap:.5rem; max-width:12rem }
.nav-state span { font-family:var(--mono); color:var(--muted); font-size:.78rem }
.nav-state span b { font-size:1.15rem; color:#e5f6ff; font-weight:700 }
.nav-segments { display:grid; grid-template-columns:repeat(4,1fr); gap:.26rem; }
.nav-segments i { height:.2rem; border-radius:.12rem; background:#3b5063 }
.nav-segments i.active { background:var(--cyan); box-shadow:0 0 .5rem #7adbe253 }
.secondary { min-height:2.7rem; }
.prev { min-height:3.22rem; padding:0 .8rem; }
.button-recess {
  min-width:22rem; border:1px solid #5a7e90; background:#09121c; border-radius:.53rem;

function strokePath(ctx,points,color,width=1,dash=[]) {

function niceLimit(x,minimum) {
  const a=Math.max(x,minimum)/2,power=10**Math.floor(Math.log10(a));
  return ([1,2,2.5,5,10].find(c=>c*power>=a)||10)*power*2;
}
function waveform(ctx,box,output) {
  const {x,y,w,h}=box;
  const {title,unit,limit,lines,position,period}=output;
  const left=x+79,right=x+w-19,top=y+36,bottom=y+h-52;
  const xPos=t=>lerp(left,right,t), yPos=v=>lerp(bottom,top,(v+limit)/(2*limit));
  roundedRect(ctx,left,top,right-left,bottom-top,4,"#0c1927","#3b5365",1.2);
  label(ctx,title,left,y+17,PALETTE.text,22);
  label(ctx,unit,right,y+17,PALETTE.small,19,"right",true);
  for(let i=0;i<=4;i++) {
    const t=i/4,x=xPos(t);
    strokePath(ctx,[[x,top],[x,bottom]],i%4===0?"#3e5669":"#263c50",1.1);
    const precision=Number.isInteger(period*t)?0:1;
    label(ctx,fmt(period*t,precision),x,bottom+19,PALETTE.small,18,"center",true);
  }
  for(let i=0;i<=4;i++) {
    const value=limit*(1-i/2),Y=yPos(value);
    strokePath(ctx,[[left,Y],[right,Y]],i===2?"#526f80":"#263c50",i===2?1.5:1.05);
    if(i%2===0) label(ctx,fmt(value,Number.isInteger(value)?0:limit<.2?2:1),left-11,Y,PALETTE.small,18,"right",true);
  }
  label(ctx,"t [ms]",right,bottom+39,PALETTE.small,17,"right",true);
  const marker=xPos(position);
  ctx.save();
  ctx.beginPath();ctx.rect(left-1,top-1,right-left+2,bottom-top+2);ctx.clip();
  for(const series of lines) {
    const samples=Array.from({length:113},(_,i)=>[xPos(i/112),yPos(series.value(i*TAU/112))]);
    strokePath(ctx,samples,series.color,series.width||3.3,series.dash||[]);
  }
  strokePath(ctx,[[marker,top],[marker,bottom]],"#d7e7e9be",1.3,[5,5]);
  for(const series of lines) disc(ctx,marker,yPos(series.value(position*TAU)),4.5,series.color,"#122132",1.55);
  ctx.restore();
}
function phaseBands(ctx,m,w,h) {

function scopePlot(ctx,index,p,v,theta,w,h) {
  const split=index===2?Math.round(h*.56):Math.round(h*.49);
  const upper={x:0,y:3,w,h:split-3}, lower={x:0,y:split,w,h:h-split};
  const pos=wrap(theta)/TAU;
  if(index===1) {
    const phase=v.f>0?pos:0,period=v.f>0?1000/v.f:1000;
    waveform(ctx,upper,{title:"Indusert spenning",unit:"e [V]",position:phase,period,
      limit:niceLimit(v.voltagePeak,5),lines:[{color:PALETTE.amber,value:a=>v.voltagePeak*Math.sin(a)}]});
    waveform(ctx,lower,{title:"Magnetisk fluks",unit:"Φ [mWb]",position:phase,period,
      limit:niceLimit(v.fluxPeak*1000,1),lines:[{color:PALETTE.cyan,value:a=>v.fluxPeak*1000*Math.cos(v.f>0?a:theta)}]});
  } else if(index===2) {

      limit:1,lines:phaseOffsets.map((offset,i)=>({color:phaseColors[i],value:a=>v.f>0?Math.cos(a-offset):0,dash:i===0?[]:i===1?[8,4]:[2,4]}))});
    ctx.save();ctx.translate(0,split);

  } else {
    waveform(ctx,upper,{title:"Primær og sekundær",unit:"u [V]",position:pos,period:1000/p.f,
      limit:niceLimit(Math.SQRT2*Math.max(p.u1,v.u2),5),lines:[

      ]});
    waveform(ctx,lower,{title:"Magnetisk fluks",unit:"Φ [mWb]",position:pos,period:1000/p.f,
      limit:niceLimit(v.fluxPeak*1000,.1),lines:[{color:PALETTE.cyan,value:a=>v.fluxPeak*1000*Math.sin(a)}]});

}
function scopeSurface(canvas,index,p,v,theta) {
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  const basis=parseFloat(getComputedStyle(document.documentElement).fontSize);
  const extra=Math.max(23.7/basis,420/h);
  surface(canvas,w*extra,h*extra,ctx=>scopePlot(ctx,index,p,v,theta,w*extra,h*extra),true);

function surface(canvas,baseW,baseH,draw,useAllSpace=false) {
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h) return;
  const ratio=Math.min(devicePixelRatio||1,1.4,1400/w,940/h);
  const dw=Math.round(w*ratio), dh=Math.round(h*ratio);
  if(canvas.width!==dw||canvas.height!==dh) {
    canvas.width=dw;canvas.height=dh;
  }
  const ctx=canvas.getContext("2d");
  let sx=dw/baseW,sy=dh/baseH;
  if(!useAllSpace) sx=sy=Math.min(sx,sy);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,dw,dh);
  ctx.setTransform(sx,0,0,sy,(dw-sx*baseW)/2,(dh-sy*baseH)/2);
  ctx.lineCap="round";ctx.lineJoin="round";
  draw(ctx);
}

            <div class="plot-area"><canvas role="img" aria-label="${info.plot} med en fasepeker som følger bevegelsen"></canvas></div>
            <p class="diagram-note" id="plot-note">${index===2?"Strømmene vises relativt til Î. Glipp er en inngangsverdi.":index===3?"Spenningskurvene bruker samme referanse ved merkede tilkoblinger.":"Kurvene viser momentanverdier over én elektrisk periode."}</p>
          </section>
        </div>
        <div class="metrics">${METRICS[index].map(([name,unit])=>`<section class="panel metric">
          <span>${name}</span><strong><b>–</b> <span class="unit">${unit}</span></strong></section>`).join("")}</div>
        <section class="panel control-panel">
          <div class="control-header"><div class="control-meta"><span class="eyebrow">Parametere</span>
          <span>Saktevisning · 1 s i modellen tar ${DISPLAY_FACTOR} s på skjermen</span></div>
          <div class="tools-pack">${flatButton("sim-play","Pause","pause")}${flatButton("sim-reset","Nullstill","reset")}</div></div>
          <div class="parameters" style="--count:${PARAMETERS[index].length}">${PARAMETERS[index].map(p=>this.control(p)).join("")}</div>
        </section>
      </div>`;
      this.canvases=[...this.host.querySelectorAll("canvas")];
      this.metrics=[...this.host.querySelectorAll(".metric strong b")];
      this.metricUnits=[...this.host.querySelectorAll(".metric .unit")];
      this.plotNote=this.host.querySelector("#plot-note");
      this.metricsCache=[];
      for(const p of PARAMETERS[index]) {
        const control=this.host.querySelector('[data-param="'+p.key+'"]');
        if(p.options) {
          for(const b of control.querySelectorAll("button")) b.addEventListener("click",()=>{
            this.params[p.key]=Number(b.dataset.value);
            this.angles.field=this.angles.electrical/(this.params.poles/2);
            this.syncControls();
            this.invalidate();
          });
        } else control.querySelector("input").addEventListener("input",event=>{
          this.params[p.key]=Number(event.target.value);
          this.syncControls();
          this.invalidate();
        });
      }
      this.host.querySelector("#sim-play").addEventListener("click",()=>{
        this.playing=!this.playing;
        this.last=0;
        this.syncControls();
        this.invalidate();
      });
      this.host.querySelector("#sim-reset").addEventListener("click",()=>{
        this.params=Object.fromEntries(PARAMETERS[index].map(p=>[p.key,p.value]));
        this.resetMotion();
        this.syncControls();
        this.invalidate();
      });
      this.syncControls();
    }
    for(const canvas of this.canvases) this.observer.observe(canvas.parentElement);
    this.invalidate();
  }
  resetMotion() {
    const phase=this.index===1?.74:this.index===2?.71:.89;
    this.angles={electrical:phase,field:phase/((this.params.poles||2)/2),rotor:this.index===2?.10:0};
    this.preview=0;
  }
  control(p) {
    const unit=p.unit?" "+p.unit:"";
    if(p.options) {
      return `<div class="parameter" data-param="${p.key}">
        <div class="range-label"><span>${p.label}</span><output>${p.value}</output></div>
        <div class="segments" role="group" aria-label="${p.label}">${p.options.map(n=>
          `<button type="button" class="flat" data-value="${n}" aria-pressed="${n===p.value}">${n}</button>`).join("")}</div></div>`;
    }
    return `<div class="parameter" data-param="${p.key}">
      <label class="range-label" for="param-${p.key}"><span>${p.label}</span><output for="param-${p.key}"></output></label>
      <input type="range" id="param-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}">
      <div class="range-limits" aria-hidden="true"><span>${fmt(p.min,p.dec||0)}${unit}</span><span>${fmt(p.max,p.dec||0)}${unit}</span></div></div>`;
  }
  syncControls() {
    for(const p of PARAMETERS[this.index]) {
      const wrapper=this.host.querySelector('[data-param="'+p.key+'"]');
      const value=this.params[p.key], human=fmt(value,p.dec||0)+(p.unit?" "+p.unit:"");
      const output=wrapper.querySelector("output");
      if(output.textContent!==human)output.textContent=human;
      if(p.options) {
        for(const b of wrapper.querySelectorAll("button")) b.setAttribute("aria-pressed",String(Number(b.dataset.value)===value));
      } else {
        const input=wrapper.querySelector("input");
        input.value=value;
        input.setAttribute("aria-valuetext",human);
        input.style.setProperty("--fill",(value-p.min)/(p.max-p.min)*100+"%");
      }
    }
    const b=this.host.querySelector("#sim-play");
    b.innerHTML=icon(this.playing?"pause":"play")+"<span>"+(this.playing?"Pause":"Spill av")+"</span>";
    b.setAttribute("aria-pressed",String(!this.playing));
  }
  invalidate() {
    if(!this.pending) this.pending=requestAnimationFrame(now=>this.frame(now));
  }
  frame(now) {
    this.pending=0;
    const elapsed=this.last?Math.min(.12,(now-this.last)/1000):0;
    this.last=now;
    const dt=this.playing?elapsed/DISPLAY_FACTOR:0;
    const p=this.params,a=this.angles,i=this.index;
    const [diagram,plot]=this.canvases;
    let values;
    if(i===0) {
      this.preview+=dt;
      this.drawIntro(this.preview);
    } else if(i===1) {
      a.electrical=wrap(a.electrical+TAU*p.n*dt/60);
      const model=generatorValues(p,a.electrical);
      values=[fmt(Math.floor(a.electrical/TAU*360)),fmt(model.flux*1000,2),fmt(model.voltage,1),fmt(model.f,1)];
      const note=p.n===0?"Stillestående rotor gir konstant fluks og e = 0.":"Kurvene viser momentanverdier over én elektrisk periode.";
      if(this.plotNote.textContent!==note)this.plotNote.textContent=note;
      surface(diagram,580,490,ctx=>generatorDiagram(ctx,p,a.electrical));
      scopeSurface(plot,i,p,model,a.electrical);
    } else if(i===2) {
      const advance=TAU*p.f*dt;
      const pairs=p.poles/2;
      a.electrical=wrap(a.electrical+advance);
      a.field=wrap(a.field+advance/pairs);
      a.rotor=wrap(a.rotor+advance/pairs*(1-p.slip/100));
      const model=motorValues(p,a.electrical);
      values=[fmt(model.sync,1),fmt(model.n,1),p.f>0?fmt(p.slip):"–",fmt(model.rotorFrequency,2)];
      const slipUnit=p.f>0?"%":"ved 0 Hz";
      if(this.metricUnits[2].textContent!==slipUnit)this.metricUnits[2].textContent=slipUnit;
      surface(diagram,580,490,ctx=>motorDiagram(ctx,model,a.field,a.rotor));
      scopeSurface(plot,i,p,model,a.electrical);
    } else {
      a.electrical=wrap(a.electrical+TAU*p.f*dt);
      const model=transformerValues(p,a.electrical);
      const ratioDigits=model.ratio<.1?3:2;
      values=[fmt(model.u2,1),fmt(model.ratio,ratioDigits),fmt(model.flux*1000,2),fmt(model.fluxPeak*1000,2)];
      surface(diagram,580,490,ctx=>transformerDiagram(ctx,model));
      scopeSurface(plot,i,p,model,a.electrical);
    }
    if(values) for(let k=0;k<values.length;k++) {
      if(values[k]!==this.metricsCache[k]) this.metrics[k].textContent=values[k];
    }
    this.metricsCache=values;
    const idle=(i===1&&p.n===0)||(i===2&&p.f===0);
    if(this.playing&&!idle&&!document.hidden) this.invalidate();
    else this.last=0;
  }
  drawIntro(age) {
    const phase=age*TAU*24+.68, mPhase=age*TAU*17+.89, tPhase=age*TAU*22+.98;
    const motor=motorValues({f:50,poles:4,slip:12},mPhase);
    const transformer=transformerValues({u1:230,n1:400,n2:160,f:50},tPhase);
    this.canvases.forEach((canvas,i)=>surface(canvas,420,555,ctx=>{
      ctx.save();ctx.translate(-.5,38);ctx.scale(.726,.726);
      if(i===0) generatorDiagram(ctx,{b:.68},phase,true);
      if(i===1) motorDiagram(ctx,motor,mPhase/2,mPhase*.88/2,true);
      if(i===2) transformerDiagram(ctx,transformer,true);
      ctx.restore();
      const left=21,top=410,width=378,height=72;
      roundedRect(ctx,left,top,width,height,8,"#0d1a29","#314b5e");
      for(let j=1;j<8;j++) strokePath(ctx,[[left+j*width/8,top+1],[left+j*width/8,top+height-1]],"#263c50");
      strokePath(ctx,[[left,top+height/2],[left+width,top+height/2]],"#536d7f",1);
      const signals=i===0?[[PALETTE.amber,0,1]]:i===1?phaseOffsets.map((p,j)=>[phaseColors[j],p,.83]):
        [[PALETTE.amber,PI/2,1],[PALETTE.gold,PI/2,.4]];
      for(const [tint,offset,amplitude] of signals) {
        const points=Array.from({length:121},(_,j)=>[
          left+width*j/120, top+height/2-Math.sin(j*TAU/60+[phase,mPhase,tPhase][i]-offset)*29*amplitude
        ]);
        strokePath(ctx,points,tint,2.45);
      }
      label(ctx,["Indusert spenning","Tre fasestrømmer","Primær- og sekundærspenning"][i],
        210,514,PALETTE.small,19,"center");
    }));
  }
}

const ROLE_ALIASES={
  venstre:"left",left:"left",v:"left",
  midtre:"center",midt:"center",senter:"center",center:"center",m:"center",
  hoyre:"right","høyre":"right",right:"right",h:"right",

};

function readRole() {
  const search=new URLSearchParams(location.search);
  let raw=search.get("vegg")||search.get("view")||"";
  if(!raw) {
    let hash="";
    try { hash=decodeURIComponent(location.hash.slice(1)); } catch { hash=location.hash.slice(1); }
    if(hash.includes("=")) {

    } else raw=hash;
  }
  return ROLE_ALIASES[raw.trim().toLowerCase()]||"";

/* ---------- Synkronisering mellom vegger i samme nettleser ---------- */
class Room {
  constructor(local,panorama) {
    this.local=local;
    this.panorama=panorama;
    this.state={index:0,reset:false,stamp:0,origin:""};
    this.walls=[];
    this.peers=new Map();
    this.lastNav=0;
    try {
      this.channel=new BroadcastChannel(CHANNEL);
      this.channel.onmessage=event=>this.receive(event.data);
    } catch { this.channel=null; }
    window.addEventListener("storage",event=>{
      if(event.key!==CHANNEL||!event.newValue) return;
      try { this.receive(JSON.parse(event.newValue)); } catch {}
    });
    window.addEventListener("pagehide",()=>this.post({type:"bye"}));
    setInterval(()=>{ this.post({type:"beat"}); this.updateOnline(); },2000);
    this.post({type:"hello"});
  }
  post(message) {
    const data={channel:CHANNEL,from:myId,roles:this.local,...message};
    if(this.channel) {
      try { this.channel.postMessage(data); } catch {}
    } else {
      try { localStorage.setItem(CHANNEL,JSON.stringify({...data,nonce:Math.random()})); } catch {}
    }
  }
  receive(d) {
    if(!d||d.channel!==CHANNEL||d.from===myId||typeof d.from!=="string") return;
    if(d.type==="bye") this.peers.delete(d.from);
    else if(Array.isArray(d.roles)) this.peers.set(d.from,{roles:d.roles.filter(r=>roleIds.includes(r)),seen:now()});
    if(d.type==="hello") this.post({type:"state",state:this.state});
    if(d.type==="state"&&d.state&&safeIndex(d.state.index)&&Number.isFinite(d.state.stamp)) this.accept(d.state);
    this.updateOnline();
  }
  accept(s) {
    const cur=this.state,origin=String(s.origin||"");
    if(s.stamp<cur.stamp||(s.stamp===cur.stamp&&origin<=cur.origin)) return;
    this.state={index:s.index,reset:!!s.reset,stamp:s.stamp,origin};
    for(const wall of this.walls) wall.render(this.state.index,this.state.reset);
  }
  navigate(delta) {
    if(now()-this.lastNav<260) return;
    if(delta<0&&this.state.index===0) return;
    this.lastNav=now();
    this.commit((this.state.index+delta+SLIDES.length)%SLIDES.length,false);
  }
  resetSlide() { this.commit(this.state.index,true); }
  commit(index,reset) {
    const s={index,reset,stamp:Math.max(now(),this.state.stamp+1),origin:myId};
    this.accept(s);
    this.post({type:"state",state:s});
  }
  online() {
    const seen=new Set(this.local);
    for(const [id,peer] of this.peers) {
      if(now()-peer.seen>6500) { this.peers.delete(id); continue; }
      peer.roles.forEach(r=>seen.add(r));
    }
    return roleIds.map(r=>seen.has(r));
  }
  updateOnline() {
    const online=this.online();
    for(const wall of this.walls) wall.sync(online);
  }
}

class Wall {
  constructor(role,host,room) {
    this.role=role;
    this.host=host;
    this.room=room;
    this.index=-1;
    this.shell();
  }
  shell() {
    const r=roles[this.role];
    const showFull=this.role==="center"||!this.room.panorama;
    this.host.innerHTML=`<main class="app-shell">
      <header class="topline">${brand()}
        <div class="top-controls">
          <div class="sync" aria-label="Synkroniserte vegger"><span class="sync-dots" aria-hidden="true"><b></b><b></b><b></b></span><span class="sync-text"></span></div>
          ${this.role!=="center"?`<div class="mini-nav" role="group" aria-label="Lysbilde">
            <button type="button" class="flat" data-nav="-1" aria-label="Forrige lysbilde">${icon("left")}</button>
            <button type="button" class="flat" data-nav="1" aria-label="Neste lysbilde">${icon("right")}</button></div>`:""}
          ${showFull?`<button type="button" class="flat" data-act="full">${icon("full")}<span>Fullskjerm</span></button>`:""}
        </div>
      </header>
      <header class="topic">
        <div><div class="eyebrow">${r.name} vegg · ${r.label}</div><h1></h1><p></p></div>
        <span class="page-index"><b>01</b> / 04</span>
      </header>
      <div class="slide-body" role="region" aria-label="${r.label}"></div>
    </main>`;
    this.body=this.host.querySelector(".slide-body");
    this.topic=this.host.querySelector(".topic");
    this.syncDisplay=this.host.querySelector(".sync");
    for(const b of this.host.querySelectorAll("[data-nav]")) b.addEventListener("click",()=>this.room.navigate(Number(b.dataset.nav)));
    this.host.querySelector('[data-act="full"]')?.addEventListener("click",toggleFullscreen);
    if(this.role==="center") {
      this.body.innerHTML=`<div class="theory-layout">
        <div class="theory-content"></div>
        <div class="concept-band">${icon("field")}<p></p></div>
        <nav class="nav-deck" aria-label="Lysbildenavigasjon">
          <div class="nav-state"><span><b>01</b> / 04</span><div class="nav-segments" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
          ${flatButton("reset-slide","Nullstill lysbilde","reset","secondary")}
          ${flatButton("previous","Forrige","left","prev")}
          <div class="button-recess"><button type="button" class="next" id="next"><span>NESTE LYSBILDE</span>${icon("right")}</button></div>
        </nav>
      </div>`;
      this.host.querySelector("#previous").addEventListener("click",()=>this.fire(-1));
      this.host.querySelector("#next").addEventListener("click",()=>this.fire(1));
      this.host.querySelector("#reset-slide").addEventListener("click",()=>this.room.resetSlide());
    }
  }
  fire(delta) {
    const b=this.host.querySelector(delta===1?"#next":"#previous");
    if(b) { b.classList.remove("fired"); void b.offsetWidth; b.classList.add("fired"); }
    this.room.navigate(delta);
  }
  sync(online) {
    const count=online.filter(Boolean).length;
    const text=this.syncDisplay.querySelector(".sync-text");
    const value=count+" / 3 vegger";
    if(text.textContent!==value) text.textContent=value;
    Array.from(this.syncDisplay.querySelectorAll("b")).forEach((dot,i)=>dot.classList.toggle("online",online[i]===true));
  }
  render(index,reset) {
    const changed=this.index!==index;
    this.index=index;
    const data=SLIDES[index];
    document.documentElement.dataset.slide=String(index+1);
    this.topic.querySelector("h1").textContent=this.role==="center"?data.headline:this.role==="left"?data.model:data.scope;
    this.topic.querySelector("p").textContent=this.role==="center"?data.subtitle:this.role==="left"?data.modelSub:data.scopeSub;
    this.topic.querySelector(".page-index b").textContent=pageNumber(index);
    for(const b of this.host.querySelectorAll('[data-nav="-1"]')) b.disabled=index===0;
    if(this.role==="center") {
      this.body.querySelector(".theory-content").innerHTML=theoryHTML(index);
      this.body.querySelector(".concept-band p").textContent=data.note;
      this.body.querySelector(".nav-state b").textContent=pageNumber(index);
      Array.from(this.body.querySelectorAll(".nav-segments i")).forEach((bar,i)=>bar.classList.toggle("active",i===index));
      this.body.querySelector("#previous").disabled=index===0;
      this.body.querySelector("#next span").textContent=index===SLIDES.length-1?"TIL INTRODUKSJONEN":"NESTE LYSBILDE";
    }
    if(this.role==="left") {
      if(!this.model) this.model=new ModelView(this.body,index);
      else if(changed||reset) this.model.show(index);
    }
    if(this.role==="right") {
      if(!this.scope) this.scope=new SimulationView(this.body,index);
      else if(changed||reset) this.scope.show(index);
    }
    if(changed) {
      this.body.classList.remove("enter");
      void this.body.offsetWidth;
      this.body.classList.add("enter");
    }
  }
}

});

    hosts=[...app.querySelectorAll(".pano-cell")];
  }
  local.forEach((r,i)=>room.walls.push(new Wall(r,hosts[i],room)));
  for(const wall of room.walls) wall.render(room.state.index,false);
  room.updateOnline();
  document.addEventListener("keydown",event=>{
    if(event.defaultPrevented||event.repeat||event.ctrlKey||event.altKey||event.metaKey) return;
    if(event.target instanceof Element&&event.target.matches("input,textarea,select,canvas")) return;
    const forward=["ArrowRight","PageDown"].includes(event.key);
    const back=["ArrowLeft","PageUp"].includes(event.key);
    if(!forward&&!back) return;
    event.preventDefault();
    const center=room.walls.find(w=>w.role==="center");
    if(center) center.fire(forward?1:-1);
    else room.navigate(forward?1:-1);
  });
}
</script>
</body>
</html>
